services:
  app-cadeaux:
    image: ghcr.io/tylerni/app-cadeaux:latest
    container_name: app-cadeaux
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT}:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - ${DATA_PATH}:/data
